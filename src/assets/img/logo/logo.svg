<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Brand Circle Emblem -->
  <circle cx="40" cy="40" r="36" fill="#1580C4" />
  
  <!-- Friendly white tooth with cute smile & sparkle -->
  <path d="M40 18 C33 18 25 21 25 29 C25 35 28 41 29 48 C30 54 32 62 35 62 C38 62 38 52 40 52 C42 52 42 62 45 62 C48 62 50 54 51 48 C52 41 55 35 55 29 C55 21 47 18 40 18 Z" fill="#FFFFFF" />
  <!-- Cute eyes and smile -->
  <circle cx="35" cy="33" r="2.2" fill="#1C2B39" />
  <circle cx="45" cy="33" r="2.2" fill="#1C2B39" />
  <path d="M36 38 C38 42 42 42 44 38" stroke="#EC1E7C" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Rosy cheeks -->
  <circle cx="31" cy="36" r="2.5" fill="#FFA5C8" opacity="0.8" />
  <circle cx="49" cy="36" r="2.5" fill="#FFA5C8" opacity="0.8" />
  <!-- Sparkle -->
  <path d="M48 22 L49.5 25 L52.5 26.5 L49.5 28 L48 31 L46.5 28 L43.5 26.5 L46.5 25 Z" fill="#FFC629" />

  <!-- Typography: ZuriDent -->
  <text x="88" y="44" font-family="'Fredoka', 'Nunito', sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5">
    <tspan fill="#1580C4">Zuri</tspan>
    <tspan fill="#EC1E7C">Dent</tspan>
  </text>

  <!-- Typography: KIDS in playful brand colors -->
  <text x="89" y="66" font-family="'Fredoka', 'Nunito', sans-serif" font-weight="700" font-size="18" letter-spacing="3">
    <tspan fill="#FFC629">K</tspan>
    <tspan fill="#3CB878">I</tspan>
    <tspan fill="#EC1E7C">D</tspan>
    <tspan fill="#1580C4">S</tspan>
  </text>
  
  <text x="165" y="65" font-family="'Nunito', sans-serif" font-weight="600" font-size="11" fill="#718096" letter-spacing="0.5">
    ODONTOPEDIATRÍA
