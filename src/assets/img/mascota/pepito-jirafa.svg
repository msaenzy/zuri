<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Soft friendly cloud background -->
  <ellipse cx="100" cy="210" rx="75" ry="18" fill="#E2F2FC" />
  
  <!-- Giraffe Body & Neck -->
  <path d="M85 130 Q80 180 65 210 Q95 220 135 210 Q120 180 115 130 Z" fill="#FFC629" />
  
  <!-- Body Spots in Brand Mint & Pink -->
  <circle cx="85" cy="180" r="9" fill="#F39C12" opacity="0.85" />
  <circle cx="112" cy="190" r="11" fill="#F39C12" opacity="0.85" />
  <circle cx="100" cy="155" r="7" fill="#F39C12" opacity="0.85" />

  <!-- Long Giraffe Neck -->
  <rect x="86" y="80" width="28" height="70" rx="14" fill="#FFC629" />
  <circle cx="98" cy="98" r="6" fill="#F39C12" opacity="0.85" />
  <circle cx="102" cy="120" r="5" fill="#F39C12" opacity="0.85" />

  <!-- Head -->
  <ellipse cx="100" cy="65" rx="30" ry="24" fill="#FFC629" />
  <!-- Muzzle/Nose -->
  <ellipse cx="100" cy="74" rx="22" ry="15" fill="#FFF2C2" />
  
  <!-- Horns / Ossicones -->
  <line x1="88" y1="46" x2="84" y2="32" stroke="#FFC629" stroke-width="6" stroke-linecap="round" />
  <circle cx="84" cy="30" r="6" fill="#EC1E7C" />
  
  <line x1="112" y1="46" x2="116" y2="32" stroke="#FFC629" stroke-width="6" stroke-linecap="round" />
  <circle cx="116" cy="30" r="6" fill="#1580C4" />

  <!-- Cute Ears -->
  <path d="M72 58 C62 50 64 42 74 50 Z" fill="#FFC629" />
  <path d="M128 58 C138 50 136 42 126 50 Z" fill="#FFC629" />
  <path d="M71 56 C65 51 66 46 72 51 Z" fill="#FFA5C8" />
  <path d="M129 56 C135 51 134 46 128 51 Z" fill="#FFA5C8" />

  <!-- Eyes with sparkle -->
  <circle cx="88" cy="60" r="4.5" fill="#1C2B39" />
  <circle cx="89.5" cy="58.5" r="1.5" fill="#FFFFFF" />
  
  <circle cx="112" cy="60" r="4.5" fill="#1C2B39" />
  <circle cx="113.5" cy="58.5" r="1.5" fill="#FFFFFF" />

  <!-- Rosy cheeks -->
  <circle cx="80" cy="69" r="4" fill="#FFA5C8" opacity="0.9" />
  <circle cx="120" cy="69" r="4" fill="#FFA5C8" opacity="0.9" />

  <!-- Friendly Smile & Toothbrush -->
  <path d="M94 77 Q100 84 106 77" stroke="#1C2B39" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="94" cy="71" r="1.5" fill="#D35400" />
  <circle cx="106" cy="71" r="1.5" fill="#D35400" />

  <!-- Pepito holding a tiny cute toothbrush -->
  <g transform="translate(110, 120) rotate(-25)">
    <rect x="0" y="0" width="8" height="50" rx="4" fill="#1580C4" />
    <rect x="-1" y="-12" width="10" height="12" rx="2" fill="#FFFFFF" />
    <path d="M-1 -12 L9 -12" stroke="#3CB878" stroke-width="3" />
    <!-- Foam sparkles -->
    <circle cx="4" cy="-16" r="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="10" cy="-18" r="2" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
